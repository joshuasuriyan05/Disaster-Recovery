- name: Deploy DR demo web app
  hosts: all
  become: yes
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Run Docker container for web app
      docker_container:
        name: dr-demo
        image: nginx:alpine
        state: started
        ports:
          - "8080:80"
        volumes:
          - "{{ playbook_dir }}/../app/index.html:/usr/share/nginx/html/index.html"
